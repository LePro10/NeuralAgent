[package]
name = "na-daemon"
description = "neuralagentd: the NeuralAgent host daemon (PTYs, agents, state, remote)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neuralagentd"
path = "src/main.rs"

[dependencies]
na-protocol.workspace = true
na-voice.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
futures-util.workspace = true
portable-pty = "0.9.0"
vt100 = "0.18.1"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
parking_lot = "0.13.0"
hostname = "0.4.2"
tokio-util = "0.7.20"
keepawake = "0.6.1"
discord-rich-presence = "1.1.0"
toml = "1.1.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
na-crypto = { path = "../na-crypto" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "stream"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
