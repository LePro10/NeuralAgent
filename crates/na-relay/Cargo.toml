[package]
name = "na-relay"
description = "NeuralAgent relay: accounts, devices, pairing and E2E message routing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "neuralagent-relay"
path = "src/main.rs"

[features]
# Lets tests and local development sign in without Google/GitHub. Never enabled in release images.
test-login = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
base64.workspace = true
rand.workspace = true
futures-util.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
parking_lot = "0.13.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "builder", "ring", "webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
ciborium = "0.2.2"
sha2.workspace = true
url = "2.5.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
