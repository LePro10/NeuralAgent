[workspace]
resolver = "3"
members = [
  "crates/na-protocol",
  "crates/na-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
authors = ["Leandro Probst"]
repository = "https://github.com/LePro10/NeuralAgent"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.9"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "serde-json-impl"] }
na-protocol = { path = "crates/na-protocol" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
