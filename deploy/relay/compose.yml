# Relay on the server (/opt/neuralagent/compose.yml). Secrets: /etc/neuralagent/relay.env.
services:
  relay:
    image: ghcr.io/lepro10/neuralagent-relay:latest
    container_name: neuralagent-relay
    restart: unless-stopped
    env_file: /etc/neuralagent/relay.env
    ports:
      - "8080:8080"
    volumes:
      - /var/lib/neuralagent:/data
      # Firebase service account for Android pushes (owned by uid 10001, mode 400; FCM_SERVICE_ACCOUNT in relay.env).
      - /etc/neuralagent/firebase-service-account.json:/run/secrets/fcm.json:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
