[package]
name = "neuralagent-desktop"
description = "NeuralAgent desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "neuralagent_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neuralagent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
bzip2 = "0.6.1"
cpal = "0.18.2"
enigo = "0.6.1"
na-voice.workspace = true
parking_lot = "0.13.0"
tar = "0.4.46"
ureq = "3.5.0"
dirs = "7.0.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sherpa-onnx.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-updater = "2.14.1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
base64 = "0.22"
