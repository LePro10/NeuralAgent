      <main style="max-width:46rem;margin:0 auto;padding:40px 24px 64px;color:#c6c9c6;font:17px/1.6 system-ui,sans-serif">
        <h1 style="margin:0 0 12px;font-size:34px;line-height:1.15;color:#eef1ee">Thirteen coding agents. One calm place.</h1>
        <p style="margin:0 0 16px">NeuralAgent runs Claude Code, Codex and eleven more coding agents side by side on your own computer. Talk to Neural, hand work to an autopilot, and answer your agents from your phone, end-to-end encrypted. Open source, for macOS, Windows, Linux and Android.</p>
        <p style="margin:0 0 32px"><a href="/download/" style="color:#b9d3ff">Download</a> · <a href="/demo/" style="color:#b9d3ff">Live demo</a> · <a href="/changelog/" style="color:#b9d3ff">Changelog</a> · <a href="/privacy/" style="color:#b9d3ff">Privacy</a> · <a href="https://github.com/LePro10/NeuralAgent" style="color:#b9d3ff">GitHub</a></p>
        <h2 style="margin:0;font-size:24px;color:#eef1ee">Questions</h2>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Does NeuralAgent upload my code?</h3>
        <p style="margin:0">No. Agents, terminals and files stay on your computer, in a background service that keeps running when you close the window, and NeuralAgent keeps no cloud copy. The agents you run still talk to their own providers, as they do in any terminal, and Neural sends its conversation to the model provider you choose. Remote access goes through a relay that only passes end-to-end encrypted messages between your own devices.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Which agents does it run?</h3>
        <p style="margin:0">Thirteen command-line agents: Claude Code, Codex, Gemini CLI, Antigravity CLI, Cursor Agent, Copilot CLI, OpenCode, Grok Build, Amp, Droid, Kimi Code, Qwen Code and Aider. Any other terminal program runs as a plain shell pane. You bring your own subscriptions and keys.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">What does it cost?</h3>
        <p style="margin:0">NeuralAgent is free and open source under the AGPL-3.0. The agent CLIs and Neural's model provider bill you separately, through your own subscriptions or keys.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Can I try it without installing?</h3>
        <p style="margin:0">Yes. The <a href="/demo/">live demo</a> runs the real app against a simulated computer in your browser. No account, no model calls, nothing is installed.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Do I need an account?</h3>
        <p style="margin:0">Not for the desktop app. An account is only needed for remote access from a phone or browser: you sign in with Google or GitHub, and access is approved on request.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">What can the relay see?</h3>
        <p style="margin:0">The relay sees who is connected and when: your account, device names and public keys, connection times and how much data moves. It never sees what your agents show or do, that is ciphertext. A push notification also tells Google, Apple or Mozilla that an event happened, such as an agent needing you. Two limits are worth knowing: a phone added by signing in trusts the relay's key directory the first time (QR pairing avoids that), and the relay also serves the web app, so encryption does not help against a compromised server shipping malicious web code. <a href="/#security">The details are above.</a></p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">How does Neural work, and what does it need?</h3>
        <p style="margin:0">Neural is the voice orchestrator. Wake word, dictation and speech output run on your computer after a one-time download of about 630 MB; the local speech models are verified on macOS only. The thinking is done by a model provider you choose and pay for, for example NeuralHub, Anthropic, an OpenAI-compatible API or a local Ollama. The key stays in your system keychain.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">What happens when I update the app?</h3>
        <p style="margin:0">It updates itself. The service that holds your agents is started from a copy outside the app, so a running agent keeps going while the window is replaced.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Is the macOS app notarized?</h3>
        <p style="margin:0">Not yet. It is signed with a stable self-signed identity. The Terminal command installs it without the macOS security prompt. With the dmg, open System Settings, Privacy &amp; Security, then Open Anyway, once.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Do Windows and Linux work?</h3>
        <p style="margin:0">Builds exist for both and are produced automatically. They have not been tested by hand yet, so macOS is the safe choice today. On Windows, SmartScreen may ask you to choose More info, then Run anyway, because there is no code-signing certificate.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">What about my iPhone?</h3>
        <p style="margin:0">There is no App Store app. Open the <a href="/app/">web remote</a> in Safari, sign in, then Add to Home Screen. Push notifications need that install. On Android there is an app with a widget, a quick-settings tile, push and lock-screen calls.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">What can my phone see on my computer?</h3>
        <p style="margin:0">Projects added from a phone are approved at once. The home folder is read-only if you allow it, and .ssh, .aws, .config, Desktop, Documents, Downloads and Library stay closed to phones.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Does NeuralAgent track me?</h3>
        <p style="margin:0">The website sets no cookies and uses no analytics or ads. The desktop app needs no account and only asks agent.neuralhub.dev for new versions, which sends your system, architecture and app version. If you use remote access, the relay stores the small set of account and device data listed in the <a href="/privacy/">privacy policy</a>.</p>
        <h3 style="margin:24px 0 4px;font-size:18px;color:#eef1ee">Is it open source?</h3>
        <p style="margin:0">Yes. The code is public on <a href="https://github.com/LePro10/NeuralAgent">GitHub</a> under the AGPL-3.0.</p>
