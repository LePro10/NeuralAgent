<!doctype html>
<html lang="en" data-accent="ice">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The demo shares this origin with the real web remote: before anything reads storage, put an
         in-memory one in its place (seeded with the look from the URL). src/demo/isolate.ts finishes the job. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var l = (q.get("look") || "").split(".");
          var pick = function (v, ok, d) {
            return ok.indexOf(v) >= 0 ? v : d;
          };
          var look = {
            appearance: pick(q.get("appearance") || l[0], ["dark", "light"], "dark"),
            scheme: pick(q.get("scheme") || l[1], ["night", "graphite", "midnight", "black", "dusk", "forest"], "night"),
            accent: pick(q.get("accent") || l[2], ["ice", "mint", "ember", "lilac", "sand", "graphite"], null),
          };
          var mem = function (seed) {
            var m = new Map(Object.entries(seed));
            return {
              getItem: function (k) {
                return m.has(k) ? m.get(k) : null;
              },
              setItem: function (k, v) {
                m.set(String(k), String(v));
              },
              removeItem: function (k) {
                m.delete(k);
              },
              clear: function () {
                m.clear();
              },
              key: function (i) {
                return Array.from(m.keys())[i] || null;
              },
              get length() {
                return m.size;
              },
            };
          };
          var local = mem({ "na:alerts": "off", "neuralagent.theme": JSON.stringify({ state: look, version: 0 }) });
          var session = mem({});
          Object.defineProperty(window, "localStorage", { value: local, configurable: true, writable: true });
          Object.defineProperty(window, "sessionStorage", { value: session, configurable: true, writable: true });
          window.__naMem = { local: local, session: session };
          // The stage page (not the iframe inside it) shows the still of its scene from the first paint, before any script of the
          // app has loaded; the stylesheet draws it (demo.css, "boot"). Same choice of view and scene as stage.tsx.
          if (q.get("embed") !== "1") {
            var h = document.documentElement;
            var w = window.innerWidth;
            var narrow = w < 900 || window.innerHeight < 500 || (matchMedia("(pointer: coarse)").matches && w < 1100);
            var view = narrow || q.get("view") === "phone" ? "phone" : "desk";
            var scene = q.get("scene") || "grid";
            var still = { grid: "grid", permission: "permission", phone: "permission", neural: "neural", team: "team", files: "files", agents: "agents", idle: "hero" }[scene] || "grid";
            h.dataset.stage = view + (narrow ? " full" : "");
            if (look.appearance === "dark" && look.scheme === "night") {
              var href = "/demo/" + view + "-" + still + ".webp";
              h.style.setProperty("--boot-poster", "url(" + href + ")");
              // The stylesheet only asks for it at first paint: ask earlier.
              var pre = document.createElement("link");
              pre.rel = "preload";
              pre.as = "image";
              pre.href = href;
              document.head.appendChild(pre);
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Link previews read the first theme-color: the brand accent. Browsers run the script and keep the dark one(s) below. -->
    <meta name="theme-color" content="#b9d3ff" id="embed-color" />
    <script>document.getElementById("embed-color").remove()</script>
