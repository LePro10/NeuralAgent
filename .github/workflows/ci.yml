name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (types, tokens, protocol, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: pnpm install --frozen-lockfile
      - name: Generated protocol types are up to date
        run: |
          pnpm --filter @neuralagent/protocol gen
          git diff --exit-code -- packages/protocol/src/gen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:tokens
      - name: Clean-room name check
        # The pattern is spelled indirectly so that it does not occur in the repo itself.
        run: |
          if git grep -niE 'br[i]dge ?(m[i]nd|sp[a]ce|v[o]ice|c[o]de)' -- . ':!pnpm-lock.yaml'; then
            echo "::error::Foreign product names found"; exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # Firebase config and release keystore live only in GitHub secrets; without them the
      # build still runs (no push, unsigned APK).
      - name: Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/android/app/google-services.json; fi
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: apps/android
        env:
          NA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NA_VERSION_CODE: ${{ github.run_number }}
        run: pnpm exec cap sync android && cd android && ./gradlew --no-daemon -q assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: neuralagent-android
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The cache keeps sherpa-onnx's build-script result but prunes the native libs it points
      # at, so make that build script run (and download them) again.
      - name: Drop stale sherpa-onnx build output
        shell: bash
        run: rm -rf target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-* target/sherpa-onnx-prebuilt
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds the frontend, so it has to exist before cargo builds the shell.
      - run: pnpm --filter @neuralagent/desktop build
      - run: cargo test --workspace --locked
      # The relay account-flow test needs the test sign-in (a feature never built into the image).
      - run: cargo test -p na-relay --features test-login --locked
      - run: cargo build --workspace --locked
      - name: Daemon smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NEURALAGENT_HOME="$RUNNER_TEMP/na-home"
          ./target/debug/neuralagentd serve > "$RUNNER_TEMP/daemon.out" 2>&1 &
          for i in $(seq 1 50); do [ -f "$NEURALAGENT_HOME/daemon.json" ] && break; sleep 0.2; done
          node scripts/daemon-smoke.mjs
          kill %1
      - name: Remote end-to-end test (relay, daemon, simulated phone)
        if: runner.os != 'Windows'
        run: |
          cargo build -p na-relay --features test-login --locked
          node --experimental-strip-types scripts/e2e-remote.ts
