# Checks that every release secret in the "release" environment is present and readable,
# without building or publishing anything. Run it by hand after changing a secret:
#   gh workflow run release-secrets.yml
name: Release secrets check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Release secrets
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
        run: |
          fail=0
          for n in GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD MACOS_SIGNING_P12 \
                   MACOS_SIGNING_P12_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD RELEASE_UPLOAD_TOKEN; do
            if [ -z "${!n}" ]; then echo "::error::$n is missing"; fail=1; else echo "$n present"; fi
          done
          printf '%s' "$GOOGLE_SERVICES_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' \
            && echo "google-services.json parses" || { echo "::error::GOOGLE_SERVICES_JSON is not JSON"; fail=1; }
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
          keytool -list -keystore "$RUNNER_TEMP/k.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null \
            && echo "Android keystore opens" || { echo "::error::Android keystore or password wrong"; fail=1; }
          printf '%s' "$MACOS_SIGNING_P12" | base64 -d > "$RUNNER_TEMP/s.p12"
          { openssl pkcs12 -in "$RUNNER_TEMP/s.p12" -passin env:MACOS_SIGNING_P12_PASSWORD -noout 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/s.p12" -passin env:MACOS_SIGNING_P12_PASSWORD -noout; } \
            && echo "macOS certificate opens" || { echo "::error::MACOS_SIGNING_P12 or password wrong"; fail=1; }
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null | grep -q "secret key" \
            && echo "updater key decodes" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY does not decode"; fail=1; }
          rm -f "$RUNNER_TEMP/k.jks" "$RUNNER_TEMP/s.p12"
          exit $fail
