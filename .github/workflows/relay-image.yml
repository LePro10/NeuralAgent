name: Relay image

# Builds the relay container and pushes it to GHCR. The server pulls it every few minutes
# (deploy/relay/update.sh) and rolls back if the new one is not healthy.
on:
  push:
    branches: [main]
    paths:
      - crates/na-relay/**
      - crates/na-crypto/**
      - deploy/relay/**
      - Cargo.lock
      - .github/workflows/relay-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Never ship a relay whose tests fail.
      - run: cargo test -p na-relay --features test-login --locked
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay/Dockerfile
          push: true
          tags: |
            ghcr.io/lepro10/neuralagent-relay:latest
            ghcr.io/lepro10/neuralagent-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
